name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main branch
        run: |
          if ! git branch -r --contains ${{ github.sha }} | grep -E '(^|\s)origin/main($|\s)'; then
            echo "Error: Tag must be created from the main branch."
            exit 1
          fi

  build-dist:
    needs: check-branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen --extra server

      - name: Build Python distributions
        run: uv build

      - name: Validate Python distributions
        run: uv run twine check dist/*

      - name: Compute release metadata
        id: release_meta
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  release-pypi:
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Build native Tauri desktop apps — one job per platform/arch.
  # PyInstaller + Rust compilation are both slow under QEMU; use native runners.
  #
  # Each platform gets optimized CMAKE_ARGS for llama.cpp:
  #   macOS:   Metal GPU acceleration (both Apple Silicon and Intel with discrete GPU)
  #   Linux:   Native CPU ISA (AVX2/AVX-512/FMA auto-detected by compiler)
  build-tauri:
    needs: build-dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
            cmake_args: "-DGGML_NATIVE=ON -DGGML_METAL=ON"
          - runner: ubuntu-latest     # Linux x86_64
            target: x86_64-unknown-linux-gnu
            cmake_args: "-DGGML_NATIVE=ON"
          - runner: ubuntu-24.04-arm  # Linux ARM64
            target: aarch64-unknown-linux-gnu
            cmake_args: "-DGGML_NATIVE=ON"
          - runner: windows-latest    # Windows x86_64 (setup EXE)
            target: x86_64-pc-windows-msvc
            cmake_args: "-DGGML_NATIVE=ON"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"

      - name: Sync Python dependencies
        run: uv sync --frozen --extra server

      - name: Build Astro dashboard
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build PyInstaller sidecar
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          echo "Building sidecar with CMAKE_ARGS=${CMAKE_ARGS}"
          uv add --dev pyinstaller
          uv run pyinstaller minder-server.spec --clean --noconfirm
          TARGET=$(rustc -Vv | grep host | cut -d' ' -f2)
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist/minder-server.exe" "src-tauri/binaries/minder-server-$TARGET.exe"
            echo "Sidecar ready: src-tauri/binaries/minder-server-$TARGET.exe"
          else
            cp "dist/minder-server" "src-tauri/binaries/minder-server-$TARGET"
            chmod +x "src-tauri/binaries/minder-server-$TARGET"
            echo "Sidecar ready: src-tauri/binaries/minder-server-$TARGET"
          fi

      - name: Set version in tauri.conf.json
        run: |
          VERSION="${{ needs.build-dist.outputs.version }}"
          python -c "
          import json, pathlib
          p = pathlib.Path('src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          cfg['version'] = '$VERSION'
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          "

      - name: Build Tauri app
        run: bun run tauri build

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release-github:
    needs: [build-dist, release-pypi, build-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download all Tauri artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/tauri
          pattern: tauri-*
          merge-multiple: true

      - name: Prepare install scripts
        run: |
          mkdir -p dist/release
          sed \
            -e 's|__REPO_OWNER__|${{ github.repository_owner }}|g' \
            -e 's|__REPO_NAME__|${{ github.event.repository.name }}|g' \
            -e 's|__RELEASE_TAG__|${{ needs.build-dist.outputs.release_tag }}|g' \
            scripts/release/install-minder-release.sh \
            > dist/release/install-minder-${{ needs.build-dist.outputs.release_tag }}.sh
          chmod +x dist/release/install-minder-${{ needs.build-dist.outputs.release_tag }}.sh

          sed \
            -e 's|__REPO_OWNER__|${{ github.repository_owner }}|g' \
            -e 's|__REPO_NAME__|${{ github.event.repository.name }}|g' \
            -e 's|__RELEASE_TAG__|${{ needs.build-dist.outputs.release_tag }}|g' \
            scripts/release/install-minder-release.ps1 \
            > dist/release/install-minder-${{ needs.build-dist.outputs.release_tag }}.ps1

      - name: Generate release notes
        run: |
          cat > dist/release/release-notes.md <<'EOF'
          ## Quick Start

          ### macOS / Linux / Windows — Native App

          #### macOS / Linux

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ needs.build-dist.outputs.release_tag }}/install-minder-${{ needs.build-dist.outputs.release_tag }}.sh | bash
          ```

          #### Windows

          ```powershell
          iwr -useb https://github.com/${{ github.repository }}/releases/download/${{ needs.build-dist.outputs.release_tag }}/install-minder-${{ needs.build-dist.outputs.release_tag }}.ps1 | iex
          ```

          Or download the installer directly from the assets below:
          - **macOS Apple Silicon**: `Minder_${{ needs.build-dist.outputs.version }}_aarch64.dmg`
          - **Windows 10/11 (setup)**: `Minder_${{ needs.build-dist.outputs.version }}_x64-setup.exe`
          - **Linux (Debian/Ubuntu)**: `minder_${{ needs.build-dist.outputs.version }}_amd64.deb` or `*_arm64.deb`
          - **Linux (AppImage)**: `Minder_${{ needs.build-dist.outputs.version }}_amd64.AppImage` or `*_aarch64.AppImage`

          ### Windows — Headless Server

          To install the headless Python server on Windows, run the installer with the `-Headless` flag:

          ```powershell
          &([scriptblock]::Create((iwr -useb https://github.com/${{ github.repository }}/releases/download/${{ needs.build-dist.outputs.release_tag }}/install-minder-${{ needs.build-dist.outputs.release_tag }}.ps1).Content)) -Headless
          ```

          ### Connect via CLI

          ```bash
          uv tool install --upgrade minder-cli
          minder login --client-key mkc_your_client_key --server-url http://localhost:8800/sse
          minder install --target vscode --target claude-code
          ```

          ### Update

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/release/update-minder.sh | bash
          ```

          ### Uninstall

          ```bash
          # Keep data:
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/release/uninstall-minder.sh | bash -s -- --keep-data
          # Full removal:
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/release/uninstall-minder.sh | bash
          ```
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release/release-notes.md
          append_body: true
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/tauri/**/*.dmg
            dist/tauri/**/*.deb
            dist/tauri/**/*.AppImage
            dist/tauri/**/*.exe
            dist/release/install-minder-${{ needs.build-dist.outputs.release_tag }}.sh
            dist/release/install-minder-${{ needs.build-dist.outputs.release_tag }}.ps1
