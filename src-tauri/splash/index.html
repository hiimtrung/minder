<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 1.5rem;
      user-select: none;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.03em;
    }
    .status {
      font-size: 0.875rem;
      color: #64748b;
    }
    .dots span {
      animation: blink 1.4s infinite both;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
    .error { color: #f87171; font-size: 0.8rem; max-width: 340px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="logo">Minder</div>
  <div class="status">
    Starting server<span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
  <div class="error" id="err" style="display:none"></div>
  <script>
    window.__minderReady = function(url) {
      window.location.replace(url);
    };
    window.__minderError = function(msg) {
      document.getElementById('err').textContent = msg;
      document.getElementById('err').style.display = 'block';
      document.querySelector('.status').style.display = 'none';
    };
  </script>
</body>
</html>
