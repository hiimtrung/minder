[server]
port = 8800
log_level = "info"

[dashboard]
static_dir = "src/dashboard/dist"

[auth]
jwt_secret = "dev-secret-key-change-me-in-prod"

[embedding]
llama_cpp_model_repo = "CompendiumLabs/bge-small-en-v1.5-gguf"
llama_cpp_model_file = "bge-small-en-v1.5-q8_0.gguf"
dimensions = 384

[llm]
provider = "llama_cpp"
llama_cpp_model_repo = "unsloth/Qwen3.5-2B-GGUF"
llama_cpp_model_file = "Qwen3.5-2B-Q4_K_M.gguf"
context_length = 8192
temperature = 0.1

[turbovec]
db_path = "~/.minder/data/vectors.tvim"

[relational_store]
provider = "sqlite"
db_path = "~/.minder/data/minder.db"

[vector_store]
provider = "turbovec"

[retrieval]
top_k = 10
rerank_top_n = 5
similarity_threshold = 0.7

[memory]
agentic_recall = false
recall_min_score = 0.4
recall_max_iterations = 1

[session]
agentic_restore = false
restore_recall_count = 5

[graph]
enable_parallel_retrieval = true
enable_checkpointing = true

[cache]
enabled = true
max_size = 1000
ttl_seconds = 3600

[verification]
enabled = true
sandbox = "subprocess"
timeout_seconds = 30

[workflow]
orchestration_runtime = "langgraph"
enforcement = "strict"
default_workflow = "tdd"
repo_state_dir = ".minder"
block_step_skips = true
