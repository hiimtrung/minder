[server]
port = 8800
log_level = "info"

[dashboard]
static_dir = "src/dashboard/dist"

[auth]
jwt_secret = "dev-secret-key-change-me-in-prod"

[embedding]
llama_cpp_model_repo = "nomic-ai/nomic-embed-text-v1.5-GGUF"
llama_cpp_model_file = "nomic-embed-text-v1.5.Q4_K_M.gguf"
dimensions = 768


[llm]
provider = "llama_cpp"
llama_cpp_model_repo = "unsloth/Qwen3.5-2B-GGUF"
llama_cpp_model_file = "Qwen3.5-2B-Q4_K_M.gguf"
context_length = 8192
temperature = 0.1

[turbovec]
db_path = "~/.minder/data/vectors.tvim"

[relational_store]
provider = "sqlite"
db_path = "~/.minder/data/minder.db"

[vector_store]
provider = "turbovec"

[retrieval]
top_k = 10
rerank_top_n = 5
similarity_threshold = 0.7

[memory]
agentic_recall = true
recall_min_score = 0.4
recall_max_iterations = 3

[session]
agentic_restore = true
restore_recall_count = 8

[graph]
enable_parallel_retrieval = true
enable_checkpointing = true

[cache]
enabled = true
max_size = 1000
ttl_seconds = 3600

[verification]
enabled = true
sandbox = "subprocess"
timeout_seconds = 30

[workflow]
orchestration_runtime = "langgraph"
enforcement = "strict"
default_workflow = "tdd"
repo_state_dir = ".minder"
block_step_skips = true

[maintenance]
enabled = true
mode = "report"
tick_seconds = 60
idle_threshold_seconds = 600
auto_active_after_idle_hours = 3.0
dashboard_editable = true

[[maintenance.jobs]]
name = "memory_dedupe"
schedule = "0 2 * * *"
require_idle = true
max_runtime_s = 300

[[maintenance.jobs]]
name = "chat_history_compact"
schedule = "0 3 * * *"
require_idle = true
max_runtime_s = 180

[[maintenance.jobs]]
name = "vector_optimize"
schedule = "0 4 * * 0"
require_idle = true
max_runtime_s = 600

[[maintenance.jobs]]
name = "sqlite_vacuum"
schedule = "0 1 * * *"
require_idle = true
max_runtime_s = 120

[[maintenance.jobs]]
name = "graph_prune"
schedule = "0 5 * * *"
require_idle = true
max_runtime_s = 120

[[maintenance.jobs]]
name = "skill_curate"
schedule = "0 * * * *"
require_idle = true
max_runtime_s = 300

[[maintenance.jobs]]
name = "error_rules_refresh"
schedule = "30 * * * *"
require_idle = true
max_runtime_s = 120

[swarm]
enabled = true
db_path = "~/.minder/data/swarm.db"
heartbeat_ttl_seconds = 120
claim_ttl_seconds = 600
failure_limit = 2
require_manifest_approval = true
dispatcher_enabled = false
