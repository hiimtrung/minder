[server]
port = 8800
log_level = "info"

[dashboard]
static_dir = "src/dashboard/dist"

[auth]
jwt_secret = "dev-secret-key-change-me-in-prod"

[embedding]
llama_cpp_model_repo = "ggml-org/embeddinggemma-300M-GGUF"
llama_cpp_model_file = "embeddinggemma-300M-Q8_0.gguf"
dimensions = 768


[llm]
provider = "llama_cpp"
llama_cpp_model_repo = "ggml-org/gemma-4-E2B-it-GGUF"
llama_cpp_model_file = "gemma-4-E2B-it-Q8_0.gguf"
context_length = 16384
temperature = 0.1

[qdrant]
url = "http://localhost:6333"
collection_prefix = "minder_"

[relational_store]
provider = "qdrant"

[vector_store]
provider = "qdrant"

[retrieval]
top_k = 10
rerank_top_n = 5
similarity_threshold = 0.7

[memory]
agentic_recall = true
recall_min_score = 0.4
recall_max_iterations = 3

[session]
agentic_restore = true
restore_recall_count = 8

[graph]
enable_parallel_retrieval = true
enable_checkpointing = true

[cache]
enabled = true
max_size = 1000
ttl_seconds = 3600

[verification]
enabled = true
sandbox = "docker"
timeout_seconds = 30

[workflow]
orchestration_runtime = "langgraph"
enforcement = "strict"
default_workflow = "tdd"
repo_state_dir = ".minder"
block_step_skips = true
