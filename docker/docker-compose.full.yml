name: minder-full
services:
  gateway:
    container_name: minder-gateway
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - "${MINDER_PORT:-8800}:8800"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - dashboard
      - minder-api

  minder-api:
    container_name: minder-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: minder-api:full
    restart: unless-stopped
    volumes:
      - ${MINDER_MODELS_DIR:-~/.minder/models}:/models
      - minder-data:/root/.minder/data
    environment:
      MINDER_SERVER__PORT: 8801
      MINDER_LLM__PROVIDER: openai
      MINDER_LLM__OPENAI_MODEL: "qwen3.5:2b"
      MINDER_LLM__OPENAI_API_BASE: "http://host.docker.internal:11434/v1"
      MINDER_LLM__OPENAI_API_KEY: "ollama"
      MINDER_VECTOR_STORE__PROVIDER: milvus
      HUGGINGFACE_HUB_CACHE: /models

  dashboard:
    container_name: minder-dashboard
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    image: minder-dashboard:full
    restart: unless-stopped
    depends_on:
      - minder-api

volumes:
  minder-data:
