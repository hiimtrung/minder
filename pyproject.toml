[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "minder-cli"
version = "0.7.5"
description = "Minder is a self-hosted Engineering Intelligence and Lean MCP Platform for AI Coding Agents."
readme = "README.md"
requires-python = ">=3.11, <3.15"
keywords = ["mcp", "cli", "ai", "code-search", "workflow", "contracts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
server = [
    "aiosqlite>=0.20.0",
    "langgraph>=1.0.0",
    "mcp>=1.2.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.20.0",
    "pydantic-settings[toml]>=2.7.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "yarl>=1.15.0",
]
local-llm = [
    "llama-cpp-python>=0.3.0",
    "turbovec>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/hiimtrung/minder"
Repository = "https://github.com/hiimtrung/minder"
Documentation = "https://github.com/hiimtrung/minder/tree/main/docs"

[project.scripts]
minder = "minder.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minder"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/minder",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = false
